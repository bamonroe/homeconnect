# Production homeconnect service.
#
#   docker compose build        # build the release image (SPA + binary)
#   docker compose up -d         # run it, restarting on failure/reboot
#   docker compose logs -f       # tail logs
#
# Data (SQLite + blobs + transcode cache) lives on the bulk disk; the port is
# bound to localhost for Caddy (hc.bam) to reverse-proxy. Runs as the
# host user so data files stay owned by you. Secrets come from .env.
#
# Distinct project name keeps this isolated from the dev compose (which also has
# a service named `app`).
name: homeconnect
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: homeconnect:local
    container_name: homeconnect-server
    restart: unless-stopped
    user: "1000:1000"
    # GPU transcoding: expose DRM render nodes and the Nvidia runtime.
    devices:
      - /dev/dri:/dev/dri
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "989"
    volumes:
      - /data/storage/homeconnect:/data
    env_file:
      - .env
    environment:
      # HC_BIND / HC_DATA_DIR / HC_WEB_DIR are baked into the image (Dockerfile).
      # GPU transcode device (not in the image); switchable at runtime in Settings.
      HC_TRANSCODE_DEVICE: "/dev/dri/renderD128"
      # Subtitles: the whisper.cpp server from the speech_services stack, reached
      # over the host gateway (it's a separate compose project, so no shared
      # network — the published port is the contract). Toggle in Settings.
      HC_WHISPER_URL: "http://host.docker.internal:8571"
      HC_SUBS_ENABLED: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - compute
                - video
    ports:
      - "127.0.0.1:8099:8099"
